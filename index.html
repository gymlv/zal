<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Журнал зала</title>
<meta name="theme-color" content="#eef0f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Зал">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Phone-app layout: compact header, split hero, cards; bottom sheets for actions; fixed tab bar within thumb reach.
   Look: light "clay" with indigo/blue accent and crisp outlined 3D equipment drawings. Single light theme by choice. */
:root{
  color-scheme:light;
  --bg:#eef0f8; --bg-2:#e3e6f3; --surface:#ffffff; --ink:#141633; --muted:#676d8a; --line:#dde0ee;
  --accent:#5b4cf0; --accent-2:#8577ff; --blue:#3b82f6; --accent-ink:#ffffff; --accent-soft:#eceaff;
  --good:#12996a; --good-bg:#dff5eb; --warn:#c77d00; --warn-bg:#fdf1d6; --bad:#dc3d3d; --bad-bg:#fde5e5; --info:#2f63d6; --info-bg:#e3ebfd;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:22px;
  --sh:0 1px 0 rgba(255,255,255,.9) inset,0 10px 24px -12px rgba(35,35,100,.26),0 2px 6px rgba(35,35,100,.06);
  --sh-press:0 2px 8px -4px rgba(35,35,100,.3) inset;
  --sh-pop:0 18px 40px -16px rgba(30,28,90,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(100px + env(safe-area-inset-bottom,0px));
  background:radial-gradient(110% 55% at 100% 0%,#ece8ff 0%,transparent 55%),radial-gradient(90% 50% at 0% 12%,#e2ecff 0%,transparent 60%),var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-block:14px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);box-shadow:0 12px 14px -12px var(--bg)}
h1{font-family:var(--display);font-weight:800;font-size:24px;margin:0;line-height:1.1;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:15px;margin:0;text-wrap:balance}
h3{font-weight:600;font-size:14px;margin:0;line-height:1.25}
.sub{color:var(--muted);font-size:13px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:700}
main{display:flex;flex-direction:column;gap:14px;padding-block:4px 14px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--sh);min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.nowrap{flex-wrap:nowrap}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:var(--surface);border-radius:14px;padding:12px 14px;font-weight:600;box-shadow:var(--sh);transition:transform .08s;min-height:44px}
button:active{transform:scale(.97);box-shadow:var(--sh-press)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid rgba(91,76,240,.45);outline-offset:2px}
.btn-primary{background:linear-gradient(180deg,var(--accent-2),var(--accent));color:var(--accent-ink);box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 12px 22px -10px rgba(91,76,240,.75)}
.btn-ghost{background:transparent;box-shadow:none;color:var(--accent)}
.btn-small{padding:8px 12px;font-size:13px;border-radius:12px;min-height:36px}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--bg-2);border:0;border-radius:14px;padding:12px;width:100%;min-width:0;box-shadow:var(--sh-press);min-height:44px}
textarea{resize:vertical;min-height:72px}
.field .lbl{margin-bottom:6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrapc{flex-wrap:wrap;overflow:visible}
.chip{flex:0 0 auto;border-radius:999px;padding:8px 13px;font-size:13px;font-weight:600;background:var(--surface);box-shadow:var(--sh);min-height:38px}
.chip.on{background:var(--ink);color:#fff}
.chip.acc.on{background:linear-gradient(180deg,var(--accent-2),var(--accent));color:#fff}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--bg-2);border-radius:16px;padding:4px;box-shadow:var(--sh-press);gap:4px}
.seg button{box-shadow:none;background:transparent;padding:9px 6px;font-size:14px;min-height:40px;border-radius:12px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.info{background:var(--info-bg);color:var(--info)}.pill.none{background:var(--bg-2);color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 auto}
.dot.good{background:var(--good)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}.dot.none{background:#c5c9dc}
/* equipment drawings */
.tile{border-radius:18px;background:linear-gradient(160deg,#ffffff 0%,#f2f3fa 55%,#e5e7f4 100%);box-shadow:0 1px 0 #fff inset,0 -10px 20px -14px rgba(35,35,100,.25) inset;display:grid;place-items:center;aspect-ratio:4/3;max-width:100%;overflow:hidden}
.tile svg{width:96%;height:auto;shape-rendering:geometricPrecision}
.eq rect,.eq circle,.eq ellipse:not(.sh),.eq path:not([fill="none"]){stroke:rgba(0,0,0,.3);stroke-width:.45;stroke-linejoin:round}
.eq .hl{stroke:none}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ex-card{background:var(--surface);border-radius:var(--r);padding:10px 10px 12px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:7px;text-align:left;min-width:0;font-weight:400;position:relative}
.ex-card h3{overflow-wrap:anywhere}
.ex-card .meta{display:flex;justify-content:space-between;align-items:center;gap:6px}
.ex-card.added{outline:2.5px solid var(--accent);outline-offset:-2.5px}
.ex-card.done .tile::after{content:"✓";position:absolute;top:16px;left:16px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--good);color:#fff;font-weight:800;font-size:14px}
.add-badge{position:absolute;top:6px;right:6px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:20px;background:var(--surface);box-shadow:var(--sh);color:var(--ink)}
.add-badge.on{background:linear-gradient(180deg,var(--accent-2),var(--accent));color:#fff}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:4px}
.hero{display:flex;flex-direction:column;gap:14px;padding:18px;background:radial-gradient(120% 120% at 100% 0%,#4a3fd0 0%,transparent 55%),linear-gradient(150deg,#26236b,#11122e);color:#fff;border-radius:26px;box-shadow:var(--sh-pop);overflow:hidden}
.hero .sub,.hero .lbl{color:#b6b8e0}
.hero .big{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1}
.hero .chip{background:rgba(255,255,255,.1);color:#fff;box-shadow:none}
.hero .chip.on{background:#fff;color:var(--ink)}
.ring{width:78px;height:78px;flex:0 0 78px}
.plan{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px;margin:0 -2px}
.plan::-webkit-scrollbar{display:none}
.pday{flex:0 0 auto;width:96px;padding:10px;border-radius:16px;background:var(--surface);box-shadow:var(--sh);display:flex;flex-direction:column;gap:4px}
.pday b{font-size:13px;line-height:1.2}
.pday.on{background:linear-gradient(160deg,var(--accent-2),var(--accent));color:#fff}
.pday.on .sub{color:#e5e2ff}
.pday.rest{background:var(--bg-2);box-shadow:none}
.ins{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px;margin:0 -2px}
.ins::-webkit-scrollbar{display:none}
.ins .alert{flex:0 0 86%;max-width:360px}
.ins .alert:only-child{flex-basis:100%;max-width:none}
#dateLine{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border-radius:18px;padding:12px;box-shadow:var(--sh);min-width:0}
.stat .num{font-size:19px}
.big2{font-family:var(--display);font-weight:800;font-size:30px;line-height:1}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(17,18,46,.38);z-index:20;backdrop-filter:blur(2px)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:28px 28px 0 0;box-shadow:0 -20px 50px -20px rgba(17,18,46,.5);max-height:92vh;overflow:auto;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.grab{width:44px;height:5px;border-radius:3px;background:#c8cbe0;margin:4px auto 2px}
.stepper{display:grid;grid-template-columns:64px minmax(0,1fr) 64px;gap:8px;align-items:center}
.stepper input{text-align:center;font-family:var(--display);font-size:26px;font-weight:700;padding:10px 4px;min-height:56px}
.stepper button{padding:12px 0;font-size:24px;min-height:56px}
.target{border-radius:18px;padding:12px 14px;background:linear-gradient(135deg,#f3f1ff,#e5e1ff);box-shadow:0 1px 0 #fff inset}
.target .num{font-size:22px;color:#3f30c9}
.set{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 8px 8px 14px;background:var(--surface);border-radius:14px;box-shadow:var(--sh)}
.x{box-shadow:none;background:transparent;color:var(--muted);padding:4px 10px;font-weight:700}
.dayrow{background:var(--surface);border-radius:18px;padding:12px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:8px}
.dayrow .chip{min-height:34px;padding:6px 11px;font-size:12.5px;background:var(--bg-2);box-shadow:none}
.dayrow .chip.on{background:var(--accent);color:#fff}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
nav.tabs .bar{max-width:560px;margin:0 auto;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-radius:24px;box-shadow:var(--sh-pop);display:grid;grid-template-columns:repeat(5,1fr);padding:6px}
nav.tabs button{box-shadow:none;background:transparent;border-radius:18px;padding:8px 2px;font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:54px}
nav.tabs button.on{background:linear-gradient(180deg,var(--accent-2),var(--accent));color:#fff}
nav.tabs svg{width:22px;height:22px}
.demo{display:inline-flex;align-items:center;gap:6px;background:var(--warn-bg);color:var(--warn);border-radius:999px;padding:0 4px 0 12px;font-size:12px;font-weight:700;box-shadow:none;min-height:36px}
.empty{text-align:center;align-items:center;padding:22px 16px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--body);font-size:11px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.bar3d{position:relative;height:14px;background:var(--bg-2);border-radius:8px;box-shadow:var(--sh-press);overflow:hidden}
.bar3d .band{position:absolute;top:0;bottom:0;background:rgba(18,153,106,.16)}
.bar3d .fill{position:absolute;left:0;top:2px;bottom:2px;border-radius:6px;background:linear-gradient(180deg,var(--accent-2),var(--accent));box-shadow:0 1px 0 rgba(255,255,255,.35) inset}
.bar3d .fill.b{background:linear-gradient(180deg,#6ea4ff,var(--blue))}
.bar3d .fill.c{background:linear-gradient(180deg,#5fd3a6,var(--good))}
.grp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.alert{border-radius:var(--r);padding:14px 16px 14px 20px;display:flex;flex-direction:column;gap:8px;background:var(--surface);box-shadow:var(--sh);position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c,var(--info))}
.alert.warn{--c:var(--warn)}.alert.bad{--c:var(--bad)}.alert.info{--c:var(--info)}.alert.good{--c:var(--good)}
.chat{display:flex;flex-direction:column;gap:8px;max-height:440px;overflow:auto}
.msg{padding:10px 12px;border-radius:16px;white-space:pre-wrap;font-size:14px;max-width:92%}
.msg.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--bg-2);border-bottom-left-radius:6px}
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:9;background:linear-gradient(180deg,#2d2a78,#14153a);color:#fff;border-radius:999px;padding:6px 6px 6px 16px;display:flex;gap:10px;align-items:center;box-shadow:var(--sh-pop)}
.timer[hidden]{display:none}
.timer .num{font-size:18px}
.timer button{background:rgba(255,255,255,.14);color:#fff;box-shadow:none;padding:6px 12px;border-radius:999px;min-height:40px}
details summary{cursor:pointer;color:var(--accent);font-size:14px;font-weight:600;min-height:32px;display:flex;align-items:center}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kv>div{background:var(--bg-2);border-radius:14px;padding:10px 12px;min-width:0}
.kv .num{font-size:18px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s cubic-bezier(.2,.9,.3,1)}@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}}
@media (min-width:520px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.rpe{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rpe button{display:flex;flex-direction:column;align-items:center;padding:6px 2px;gap:0;min-height:52px}
.rpe button span{font-size:11px;color:var(--muted);font-weight:500}
.rpe button.on{background:linear-gradient(180deg,var(--accent-2),var(--accent));color:#fff}
.rpe button.on span{color:#e5e2ff}
.ghost{background:var(--surface);border-radius:16px;padding:10px 12px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:4px}
#ghostOpts[hidden]{display:none}
.info{background:var(--surface);border-radius:16px;padding:12px 14px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:4px}
.info ul{margin:0;padding-left:18px}
.goal{display:flex;flex-direction:column;gap:6px;padding:12px;background:var(--bg-2);border-radius:16px}
.medals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.medal{background:var(--bg-2);border-radius:16px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:2px;align-items:center;opacity:.55;filter:grayscale(1)}
.medal.on{opacity:1;filter:none;background:linear-gradient(160deg,#f3f1ff,#e3defe);box-shadow:var(--sh)}
.medal .ic{font-size:26px}
.medal b{font-size:12px;line-height:1.2}
.seg button{font-size:13px}

/* ===== v5 polish ===== */
h1{background:linear-gradient(95deg,#141633 30%,#4a3bd8 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.tile{background:radial-gradient(120% 90% at 50% 8%,#ffffff 0%,#f0f1f6 55%,#dcdfe8 100%);box-shadow:0 1px 0 #fff inset,0 -12px 24px -16px rgba(20,20,50,.35) inset,0 0 0 1px rgba(20,20,60,.05);position:relative}
.tile .ph{width:100%;height:100%;object-fit:cover;display:block}
button{background:linear-gradient(180deg,#ffffff,#f0f1f7);box-shadow:0 1px 0 #fff inset,0 -2px 0 rgba(30,30,90,.05) inset,0 3px 0 #d3d6e4,0 8px 18px -8px rgba(30,30,90,.35);transition:transform .12s cubic-bezier(.2,.8,.2,1),box-shadow .12s,background .2s}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #fff inset,0 1px 0 #d3d6e4,0 3px 8px -4px rgba(30,30,90,.3)}
.btn-primary{position:relative;overflow:hidden;background:linear-gradient(180deg,#968bff 0%,#6a5af5 48%,#4f3fe0 100%);box-shadow:0 1px 0 rgba(255,255,255,.45) inset,0 -3px 0 rgba(0,0,0,.12) inset,0 4px 0 #3626b0,0 14px 24px -10px rgba(79,63,224,.85);text-shadow:0 1px 1px rgba(0,0,0,.2)}
.btn-primary:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 1px 0 #3626b0,0 6px 12px -6px rgba(79,63,224,.7)}
.btn-primary::after{content:"";position:absolute;top:0;bottom:0;width:38%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.38),transparent);transform:skewX(-20deg);animation:shine 5s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,72%{left:-60%}100%{left:135%}}
.btn-ghost,.x,.seg button,nav.tabs button,.ex-card>button[data-open],.demo{background:transparent;box-shadow:none}
.btn-ghost:active,.x:active,.seg button:active{transform:scale(.96);box-shadow:none}
.seg button.on{background:linear-gradient(180deg,#fff,#f4f5fa);box-shadow:0 1px 0 #fff inset,0 2px 0 #d3d6e4,0 6px 14px -8px rgba(30,30,90,.35)}
.chip{background:linear-gradient(180deg,#fff,#f2f3f8);box-shadow:0 1px 0 #fff inset,0 2px 0 #d6d9e6,0 6px 12px -8px rgba(30,30,90,.3)}
.chip.on{background:linear-gradient(180deg,#2b2e52,#14152b);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 2px 0 #07081a,0 8px 16px -8px rgba(20,20,60,.6)}
.chip.acc.on{background:linear-gradient(180deg,#968bff,#5b4cf0);box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 2px 0 #3626b0,0 8px 16px -8px rgba(79,63,224,.7)}
.hero .chip{background:rgba(255,255,255,.1);box-shadow:0 1px 0 rgba(255,255,255,.12) inset}
.hero .chip.on{background:#fff;color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.add-badge.on{background:linear-gradient(180deg,#968bff,#5b4cf0);box-shadow:0 2px 0 #3626b0,0 6px 12px -6px rgba(79,63,224,.8)}
nav.tabs .bar{position:relative;background:linear-gradient(180deg,#2c2f50 0%,#17182f 55%,#101124 100%);border-radius:26px;padding:7px;box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 -1px 0 rgba(0,0,0,.5) inset,0 0 0 1px rgba(255,255,255,.05),0 22px 40px -14px rgba(16,14,60,.75),0 6px 14px -6px rgba(16,14,60,.5);backdrop-filter:none}
.tab-ind{position:absolute;top:7px;bottom:7px;left:7px;width:calc((100% - 14px)/5);border-radius:19px;background:linear-gradient(180deg,#a59bff 0%,#6a5af5 50%,#4b3cdc 100%);box-shadow:0 1px 0 rgba(255,255,255,.55) inset,0 -2px 0 rgba(0,0,0,.18) inset,0 10px 22px -6px rgba(120,100,255,.85),0 0 0 1px rgba(255,255,255,.08);transition:transform .5s cubic-bezier(.3,1.35,.45,1);z-index:0}
.tab-ind::after{content:"";position:absolute;left:18%;right:18%;top:3px;height:38%;border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0))}
nav.tabs button{position:relative;z-index:1;color:#9599c2;background:transparent!important;box-shadow:none!important}
nav.tabs button.on{color:#fff;background:transparent!important}
nav.tabs svg{transition:transform .45s cubic-bezier(.3,1.6,.5,1),filter .3s}
nav.tabs button.on svg{transform:translateY(-2px) scale(1.14);filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
nav.tabs button:active{transform:scale(.94)}
.card,.alert,.stat,.ex-card,.set,.info,.ghost,.dayrow{border:1px solid rgba(255,255,255,.8)}
.ex-card{transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s}
.ex-card:active{transform:scale(.97)}
.ex-card .tile svg,.ex-card .tile .ph{transition:transform .4s cubic-bezier(.3,1.5,.5,1)}
@media (hover:hover){.ex-card:hover{transform:translateY(-3px);box-shadow:0 1px 0 #fff inset,0 18px 30px -16px rgba(35,35,100,.4)}.ex-card:hover .tile svg{transform:translateY(-3px) scale(1.04)}}
.sec h2::before{content:"";display:inline-block;width:4px;height:14px;border-radius:2px;background:linear-gradient(var(--accent-2),var(--accent));margin-right:8px;vertical-align:-1px}
.hero{background-size:200% 200%;animation:heroShift 16s ease-in-out infinite alternate;position:relative}
.hero::before{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:0 1px 0 rgba(255,255,255,.18) inset;pointer-events:none}
@keyframes heroShift{from{background-position:0% 0%}to{background-position:100% 70%}}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
#view.anim>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
#view.anim>*:nth-child(2){animation-delay:.05s}#view.anim>*:nth-child(3){animation-delay:.1s}#view.anim>*:nth-child(4){animation-delay:.15s}#view.anim>*:nth-child(5){animation-delay:.2s}#view.anim>*:nth-child(6){animation-delay:.25s}#view.anim>*:nth-child(n+7){animation-delay:.3s}
#view.anim .ring circle:nth-child(2){animation:ringIn 1.1s cubic-bezier(.2,.8,.2,1) .2s both}
@keyframes ringIn{from{stroke-dasharray:0 999}}
.scrim{animation:fade .25s both}@keyframes fade{from{opacity:0}}
.sheet{animation:up .42s cubic-bezier(.2,1.15,.3,1)}
.sheet .in>*{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
.medal.on .ic{animation:pop .7s cubic-bezier(.3,1.6,.5,1) both}@keyframes pop{from{transform:scale(.4) rotate(-15deg);opacity:0}}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;padding:16px;border-radius:22px;min-height:170px}
.mode .mi{font-size:30px;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(160deg,#f3f1ff,#dcd6ff);box-shadow:0 1px 0 #fff inset,0 6px 14px -8px rgba(79,63,224,.6)}
.mode b{font-family:var(--display);font-size:15px}
.mode span:last-child{font-weight:400;color:var(--muted);font-size:13px;line-height:1.35}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;padding:12px;border-radius:16px}
.opt span{font-weight:400;font-size:12px;color:var(--muted)}
.opt.on{background:linear-gradient(180deg,#968bff,#5b4cf0);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 3px 0 #3626b0,0 10px 18px -8px rgba(79,63,224,.7)}
.opt.on span{color:#e7e4ff}
.wbar{height:6px;border-radius:3px;background:var(--bg-2);overflow:hidden;box-shadow:var(--sh-press)}
.wbar span{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#8577ff,#3b82f6);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.prow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.prow>span{font-size:14px;min-width:0}
.tri{display:grid;grid-template-columns:repeat(3,auto);gap:4px;background:var(--bg-2);padding:3px;border-radius:12px;flex:0 0 auto}
.tri button{min-height:34px;padding:5px 8px;font-size:12px;border-radius:9px;background:transparent;box-shadow:none;color:var(--muted)}
.tri button.on{color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.tri .t-1{background:linear-gradient(180deg,#ff8a7a,#e2463a)}.tri .t0{background:linear-gradient(180deg,#fff,#f0f1f7);color:var(--ink)}.tri .t1{background:linear-gradient(180deg,#4fd1a0,#12996a)}
.dayrow.rest{background:var(--bg-2);box-shadow:none}
.ai-badge{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(160deg,#a59bff,#5b4cf0);box-shadow:0 2px 0 #3626b0}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
html,body{margin:0;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}

function addDays(s,n){const d=dateOf(s);d.setDate(d.getDate()+n);return todayStr(d)}
function dateOf(s){const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function daysBetween(a,b){return Math.round((dateOf(b)-dateOf(a))/864e5)}
function fmtDay(s){return dateOf(s).toLocaleDateString("ru-RU",{day:"numeric",month:"short"}).replace(".","")}
function fmtLong(s){return dateOf(s).toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"})}

const RIR={6:"4+",7:"3",8:"2",9:"1",10:"0"};

function groupStats(fromDay,toDay){const today=toDay||todayStr(),from=fromDay||addDays(today,-27),ck=from+"|"+today;if(_gsC[ck])return _gsC[ck];const res={};_gsC[ck]=res;GROUPS.forEach(g=>res[g]={sets28:0,ever:0,rates:[],daySet:new Set(),last:null});

function workoutDays(){return Object.keys(S.days).filter(d=>S.days[d].sets.length).sort()}
function streak(){const today=todayStr(),wds=new Set(workoutDays());let cur=0,best=0,run=0;
  if(S.split){const first=workoutDays()[0];if(!first)return{cur:0,best:0,unit:"тренировок"};
    for(let d=first;d<=today;d=addDays(d,1)){const sd=splitDay(d);if(wds.has(d)){run++}else if(sd&&!sd.rest&&d!==today){run=0}best=Math.max(best,run)}
    return{cur:run,best,unit:"тренировок по плану подряд"}}
  const weeks={};workoutDays().forEach(d=>{const k=Math.floor(daysBetween("2020-01-06",d)/7);weeks[k]=(weeks[k]||0)+1});const kn=Math.floor(daysBetween("2020-01-06",today)/7);
  for(let k=Math.min(...Object.keys(weeks).map(Number),kn);k<=kn;k++){if((weeks[k]||0)>=2)run++;else if(k!==kn)run=0;best=Math.max(best,run)}return{cur:run,best,unit:"недель по 2+ тренировки"}}

function trendVerdict(){const p=S.profile,t=weightTrend(),w=curWeight();if(!p||!t||!w)return null;const g=GOALS[p.goal]||GOALS.keep,[lo,hi]=g.range;
  if(t.pctWeek>hi){const d=r50((t.pctWeek-hi)/100*w*7700/7);return{k:"warn",text:"Вес растёт быстрее цели ("+(t.kgWeek>0?"+":"")+fmtW(t.kgWeek)+" кг/нед). Убери ≈"+Math.max(100,d)+" ккал в день.",kcal:-Math.max(100,d)}}
  if(t.pctWeek<lo){const d=r50((lo-t.pctWeek)/100*w*7700/7);return{k:"warn",text:"Вес "+(t.kgWeek<0?"падает":"растёт")+" медленнее цели ("+(t.kgWeek>0?"+":"")+fmtW(t.kgWeek)+" кг/нед). Добавь ≈"+Math.max(100,d)+" ккал в день.",kcal:Math.max(100,d)}}
  return{k:"good",text:"Темп в норме для цели «"+g.n.toLowerCase()+"»: "+(t.kgWeek>0?"+":"")+fmtW(t.kgWeek)+" кг/нед.",kcal:0}}
const STD={"жим-штанги-лёжа":[0.75,1,1.25,1.5],"приседания-со-штангой":[1,1.25,1.75,2.25],"становая-тяга":[1.25,1.5,2,2.5]};
const LVL=["новичок","любитель","средний","продвинутый","сильный"];
function strengthLevels(){const w=curWeight();if(!w)return[];const fem=S.profile&&S.profile.sex==="f";
  return Object.keys(STD).map(id=>{const ss=sessionsOf(id);if(!ss.length)return null;const best=Math.max(...ss.map(s=>s.best)),ratio=best/w,th=STD[id].map(x=>x*(fem?0.65:1));let lv=0;th.forEach(t=>{if(ratio>=t)lv++});
    return{ex:exById(id),best,ratio,lv,next:th[lv]?Math.ceil(th[lv]*w/2.5)*2.5:null}}).filter(Boolean)}

// ================= today list & live queue =================
function todayList(){const day=S.days[S.day]||{sets:[],swaps:{}},sets=day.sets,swaps=day.swaps||{},done=new Set(sets.map(s=>s.ex));
  const dd=splitDay(S.day),groups=dd&&!dd.rest?dd.g:[...new Set(sets.map(s=>(exById(s.ex)||{}).group).filter(Boolean))];
  const items=[];if(dd&&!dd.rest&&dd.ex){dd.ex.forEach(x=>{const e=exById(x.id);if(!e)return;const alt=swaps[e.id]&&exById(swaps[e.id]);items.push({ex:alt||e,orig:alt?e:null,plan:x})})}else S.program.map(exById).filter(e=>e&&groups.includes(e.group)).forEach(e=>{const alt=swaps[e.id]&&exById(swaps[e.id]);items.push({ex:alt||e,orig:alt?e:null})});
  sets.forEach(s=>{const e=exById(s.ex);if(e&&!items.some(i=>i.ex.id===e.id))items.push({ex:e,orig:null,extra:true})});
  const setsOf=id=>sets.filter(s=>s.ex===id).length;
  return{items,groups,done,setsOf,dd}}
function queue(L){const busyNow=id=>S.busy[id]&&Date.now()-S.busy[id]<15*60e3;
  const left=L.items.filter(i=>L.setsOf(i.ex.id)<(i.plan?i.plan.sets:3)),order=[],gi=g=>Math.max(0,L.groups.indexOf(g));
  const pool=left.slice().sort((a,b)=>(isCompound(b.ex)-isCompound(a.ex))||(gi(a.ex.group)-gi(b.ex.group)));
  let prev=null;const started=left.find(i=>L.setsOf(i.ex.id)>0);if(started){order.push(started);pool.splice(pool.indexOf(started),1);prev=started.ex.group}
  while(pool.length){let k=pool.findIndex(i=>!busyNow(i.ex.id)&&i.ex.group!==prev);if(k<0)k=pool.findIndex(i=>!busyNow(i.ex.id));if(k<0)k=0;const it=pool.splice(k,1)[0];order.push(it);prev=it.ex.group}
  return{order,busy:busyNow}}
function alternatives(ex){if(!ex||!ex.sub)return[];return S.catalog.filter(e=>e.sub===ex.sub&&e.id!==ex.id).sort((a,b)=>((a.eq===ex.eq)-(b.eq===ex.eq))||((a.cat===ex.cat)-(b.cat===ex.cat))||(S.program.includes(b.id)-S.program.includes(a.id)))}
function swapToday(origId,altId){ensureReal();const d=S.days[S.day]||(S.days[S.day]={sets:[],swaps:{}});d.swaps=d.swaps||{};
  const keyOrig=Object.keys(d.swaps).find(k=>d.swaps[k]===origId)||origId;if(altId===keyOrig)delete d.swaps[keyOrig];else d.swaps[keyOrig]=altId;persistDay(S.day);inval();render()}

function insights(){const out=[],today=todayStr();
  if(S.split&&S.day===today){const y=addDays(today,-1),yd=splitDay(y);
    if(yd&&!yd.rest&&!(S.days[y]&&S.days[y].sets.length)&&!(S.days[today]&&S.days[today].sets.length)&&workoutDays().length)out.push({lvl:"info",title:"Вчера не было тренировки",text:"По плану было: "+dayName(yd)+". Сдвинуть расписание, чтобы сделать это сегодня?",act:["Сдвинуть",()=>setDayIdx(splitIdx(y))]});}
  const L=todayList();L.items.map(i=>i.ex).forEach(ex=>{const rc=recordChance(ex);if(rc&&out.filter(o=>o.kind==="pr").length<2)out.push({lvl:"good",kind:"pr",title:"Шанс рекорда · "+ex.name,text:"Сила растёт, мышцы отдохнули. Попробуй "+fmtW(rc.w)+" кг × "+rc.r+" — это новый рекорд.",act:["Открыть",()=>openSheet(ex.id)]})});
  const dd=splitDay(S.day);if(dd&&!dd.rest){const gs=groupStats();const hot=dd.g.filter(g=>gs[g].last&&gs[g].last<S.day&&daysBetween(gs[g].last,S.day)<2);
    if(hot.length)out.push({lvl:"warn",title:"Мышцы не восстановились",text:hot.join(", ")+" работали вчера. Нужно ~48 часов — снизь объём или поменяй день."});}
  const v=trendVerdict();if(v&&v.k!=="good")out.push({lvl:"warn",title:"Вес и цель",text:v.text,act:["Открыть «Тело»",()=>{S.tab="body";render()}]});
  exAlerts().filter(a=>a.kind==="plateau"||a.kind==="drop").slice(0,2).forEach(a=>out.push({...a,act:["Что делать",()=>{S.tab="coach";render()}]}));
  return out}

function lineChart(pts,dots,unit){
  const W=600,H=210,P={l:38,r:14,t:14,b:28};const xs=pts.map(p=>dateOf(p.d).getTime()),x0=Math.min(...xs),x1=Math.max(...xs);
  const ys=pts.map(p=>p.v).concat((dots||[]).map(p=>p.v));let y0=Math.min(...ys),y1=Math.max(...ys);const pad=(y1-y0)*0.18||2;y0=Math.max(0,y0-pad);y1+=pad;
  const X=t=>P.l+(x1===x0?.5:(t-x0)/(x1-x0))*(W-P.l-P.r),Y=v=>P.t+(1-(v-y0)/(y1-y0))*(H-P.t-P.b);
  let g="";for(let i=0;i<=4;i++){const v=y0+(y1-y0)*i/4;g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${P.l-6}" y="${Y(v)+4}" text-anchor="end">${y1-y0<10?fmtW(v):Math.round(v)}</text>`}
  const line=pts.map((p,i)=>(i?"L":"M")+X(xs[i]).toFixed(1)+" "+Y(p.v).toFixed(1)).join(" "),n=pts.length-1;
  const area=line+` L${X(xs[n]).toFixed(1)} ${H-P.b} L${X(xs[0]).toFixed(1)} ${H-P.b} Z`;
  const L=[0,Math.floor(n/2),n].filter((v,i,a)=>a.indexOf(v)===i).map(i=>`<text x="${X(xs[i])}" y="${H-8}" text-anchor="${i===0?"start":i===n?"end":"middle"}">${fmtDay(pts[i].d)}</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="График, ${unit}"><defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b4cf0" stop-opacity=".26"/><stop offset="1" stop-color="#5b4cf0" stop-opacity="0"/></linearGradient></defs>${g}<path d="${area}" fill="url(#ar)"/><path d="${line}" fill="none" stroke="#5b4cf0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${(dots||[]).map(p=>`<circle cx="${X(dateOf(p.d).getTime())}" cy="${Y(p.v)}" r="3.5" fill="#3b82f6"/>`).join("")}<circle cx="${X(xs[n])}" cy="${Y(pts[n].v)}" r="7" fill="#fff" stroke="#5b4cf0" stroke-width="3"/>${L}</svg>`}

      const keys=Object.keys(PARTS).flatMap(g=>PARTS[g].map(p=>g+"|"+p[0]));
      try{const j=await s.json("Человек описал, что хочет от тренировок: «"+Q.text+"».\nВерни ТОЛЬКО JSON: {\"goal\":\"mass|strength|cut|fit или null\",\"exp\":\"new|mid|pro или null\",\"days\":число 2-6 или null,\"mins\":45|60|90 или null,\"equip\":\"full|free|machines|home или null\",\"focus\":[до 4 мышц из списка],\"parts\":{\"ключ\":-1 если отстаёт, 1 если сильная},\"inj\":[из: "+Object.keys(INJ).join(", ")+"]}.\nМышцы: "+GROUPS.join(", ")+".\nКлючи частей: "+keys.join("; ")+".\nНе выдумывай: чего нет в тексте — null или пусто.",{modelTier:"quick"});
        if(j){if(QGOAL[j.goal])Q.goal=j.goal;if(QEXP[j.exp])Q.exp=j.exp;if(j.days>=2&&j.days<=6)Q.days=Math.round(j.days);if([45,60,90].includes(+j.mins))Q.mins=+j.mins;if(QEQ[j.equip])Q.equip=j.equip;
          if(Array.isArray(j.focus)){const f=j.focus.filter(g=>GROUPS.includes(g)).slice(0,4);if(f.length)Q.focus=f}
          if(j.parts&&typeof j.parts==="object")Object.keys(j.parts).forEach(k=>{if(keys.includes(k)&&(j.parts[k]===-1||j.parts[k]===1))Q.parts[k]=j.parts[k]});
          if(Array.isArray(j.inj))Q.inj=j.inj.filter(k=>INJ[k])}
        note="Заполнил по твоему описанию — проверь и поправь";step=1;draw()}
      catch(e){note=aiErr(e);draw()}};
  };draw()}
function showPlan(Q){const P=buildPlan(Q),focus=Q.focus||[];
  showSheet(`<div class="row between nowrap"><div style="min-width:0"><div class="lbl">Готово · вариант ${Q.seed}</div><h2 style="font-size:20px">Твоя программа</h2></div><button class="btn-small" id="closeSheet" aria-label="Закрыть">✕</button></div>
    <div class="sub">${esc(QGOAL[Q.goal][0])} · ${P.days.filter(d=>!d.rest).length} трен. в цикле из ${P.days.length} дн. · до ~${P.mins} мин</div>
    <div class="chips wrapc">${Object.keys(P.weekly).sort((a,b)=>GROUPS.indexOf(a)-GROUPS.indexOf(b)).map(g=>`<span class="chip${focus.includes(g)?" on":""}" style="cursor:default">${esc(g)} · ${P.weekly[g]}</span>`).join("")}</div>
    <div class="sub">Цифра — рабочих подходов в неделю.</div>
    ${P.days.map((d,i)=>d.rest?`<div class="dayrow rest"><b>${i+1}. Отдых</b></div>`:`<div class="dayrow"><b>${i+1}. ${esc(dayName(d))}</b>${d.ex.map(x=>{const e=exById(x.id);return `<div class="prow"><div class="row nowrap" style="gap:10px;min-width:0"><div class="tile" style="width:48px;flex:0 0 48px">${pic(e)}</div><div style="min-width:0"><div style="font-weight:600;font-size:14px;line-height:1.2">${esc(e.name)}</div><div class="sub" style="font-size:12px">${x.sets} × ${x.lo}–${x.hi}${x.why?" · "+esc(x.why):""}</div></div></div></div>`}).join("")}</div>`).join("")}
    <button class="btn-primary" id="pApply">Применить программу</button><div class="grid" style="grid-template-columns:1fr 1fr"><button id="pAgain">Другой вариант</button><button id="pEdit">Изменить ответы</button></div>
    <div class="sub">После применения всё можно менять: замены 1-в-1, своё упражнение, расписание.</div>`);
  $("pAgain").onclick=()=>{Q.seed=(Q.seed||1)+1;showPlan(Q)};$("pEdit").onclick=()=>{S.prefs.quiz=Q;openWizard(1)};
  $("pApply").onclick=()=>{ensureReal();S.split={days:P.days.map(d=>d.rest?{rest:true}:{g:d.g,ex:d.ex}),anchor:S.day,idx0:0};
    S.program=[...new Set(P.days.flatMap(d=>d.ex?d.ex.map(x=>x.id):[]))];P.days.forEach(d=>(d.ex||[]).forEach(x=>{const e=exById(x.id);if(e){e.lo=x.lo;e.hi=x.hi;e.changed=true}}));
    S.prefs.mode="auto";S.prefs.quiz=Q;persistCatalog();closeSheet();S.tab="today";S.animate=true;render();scrollTo(0,0);setSync("Программа применена")}}
function replaceForever(fromId,toId){ensureReal();const k=S.program.indexOf(fromId);if(k>=0)S.program.splice(k,1,toId);else if(!S.program.includes(toId))S.program.push(toId);
  if(S.split)S.split.days.forEach(d=>(d.ex||[]).forEach(x=>{if(x.id===fromId)x.id=toId}));
  const d=S.days[S.day];if(d&&d.swaps&&d.swaps[fromId]){delete d.swaps[fromId];persistDay(S.day)}persistCatalog();render()}
function planEntry(id){const dd=splitDay(S.day);return dd&&dd.ex?dd.ex.find(x=>x.id===id):null}
function findEx(s){s=String(s||"").trim().toLowerCase();return exById(s)||S.catalog.find(e=>e.name.toLowerCase()===s)||S.catalog.find(e=>e.name.toLowerCase().includes(s))||null}
function coachTools(){const brief=e=>({id:e.id,name:e.name,group:e.group,movement:subOf(e)?subOf(e).n:"",equipment:CATS[e.cat]});
  return[{name:"search_exercises",description:"Поиск по библиотеке упражнений приложения. Аргументы: query (часть названия) и/или group (мышца). Возвращает до 15 упражнений с id.",inputSchema:{type:"object",properties:{query:{type:"string"},group:{type:"string"}}},execute:i=>{const q=String(i.query||"").toLowerCase(),g=String(i.group||"");return S.catalog.filter(e=>(!q||e.name.toLowerCase().includes(q))&&(!g||e.group===g)).slice(0,15).map(brief)}},
   {name:"find_alternatives",description:"Замены 1-в-1 (тот же тип движения, та же часть мышцы) для упражнения по id или названию. Возвращает список с id.",inputSchema:{type:"object",properties:{exercise:{type:"string"}},required:["exercise"]},execute:i=>{const e=findEx(i.exercise);if(!e)throw new Error("Упражнение не найдено");return alternatives(e).slice(0,10).map(brief)}},
   {name:"swap_today",description:"Заменить упражнение только на сегодняшнюю тренировку. Аргументы: from и to — id или названия. Можно отменить в приложении.",inputSchema:{type:"object",properties:{from:{type:"string"},to:{type:"string"}},required:["from","to"]},execute:i=>{const a=findEx(i.from),b=findEx(i.to);if(!a||!b)throw new Error("Упражнение не найдено");swapToday(a.id,b.id);setSync("Тренер заменил на сегодня: "+b.name);return"Готово: сегодня «"+b.name+"» вместо «"+a.name+"»"}},
   {name:"replace_in_program",description:"Заменить упражнение в программе навсегда. Используй, только если человек явно просит навсегда. Аргументы: from и to — id или названия.",inputSchema:{type:"object",properties:{from:{type:"string"},to:{type:"string"}},required:["from","to"]},execute:i=>{const a=findEx(i.from),b=findEx(i.to);if(!a||!b)throw new Error("Упражнение не найдено");replaceForever(a.id,b.id);setSync("Тренер заменил в программе: "+b.name);return"Готово: в программе «"+b.name+"» вместо «"+a.name+"»"}}]}
async function uploadPhoto(id){const ex=exById(id);let assets=null;try{assets=window.claude&&window.claude.use?await window.claude.use("assets"):null}catch(e){}
  if(!assets){setSync("Своё фото можно поставить, когда приложение открыто на claude.ai");return}
  const f=await pickPhoto();if(!f)return;setSync("загружаю фото…");
  try{const b=await shrink(f);const r=await assets.upload(b);ensureReal();ex.photo=r.id;ex.changed=true;persistCatalog();setSync("Фото сохранено");render();openSheet(id,"info")}
  catch(e){setSync("Фото не загрузилось ("+(e&&e.code||"ошибка")+")")}}

function loadDemo(){
  S.real={catalog:S.catalog.filter(e=>e.custom||e.changed),days:S.days,program:S.program,split:S.split,profile:S.profile,body:S.body,goals:S.goals,prefs:S.prefs};S.demo=true;S.days={};S.catalog=baseCatalog();inval();
  S.split={days:JSON.parse(JSON.stringify(PRESETS[0].days)),anchor:todayStr(),idx0:0};S.profile={sex:"m",age:24,h:182,goal:"mass",life:"mid"};S.prefs={ghost:"30"};
  const plan=[["Жим штанги лёжа",60,2.5,"good",0],["Жим гантелей на наклонной",22,2,"good",0],["Пек-дек",40,5,"good",0],["Разгибания на блоке (канат)",25,5,"good",0],["Французский жим",25,2.5,"plateau",0],
    ["Приседания со штангой",80,5,"good",1],["Жим ногами",140,10,"good",1],["Сгибания ног лёжа",35,5,"drop",1],["Жим гантелей сидя",18,2,"plateau",1],["Махи гантелями в стороны",8,1,"plateau",1],["Обратный пек-дек",30,5,"good",1],["Хип-траст",60,5,"good",1],["Подъёмы на носки стоя",60,5,"good",1],
    ["Тяга верхнего блока широким хватом",55,5,"good",2],["Тяга штанги в наклоне",60,2.5,"good",2],["Становая тяга",100,5,"good",2],["Подъём гантелей на бицепс",12,2,"good",2],["Молотки",14,2,"plateau",2],["Сгибание запястий со штангой",20,2.5,"good",2]];
  const id=n=>(S.catalog.find(e=>e.name===n)||{}).id;S.program=plan.map(p=>id(p[0])).filter(Boolean);
  let n=0;
  for(let d=-70;d<0;d++){const day=addDays(todayStr(),d),sd=splitDay(day);if(!sd||sd.rest)continue;const k=splitIdx(day);n++;const sets=[];
    plan.filter(p=>p[4]===k).forEach(([name,w0,inc,mode])=>{const ex=id(name),c=Math.floor(n/3);
      const w=w0+(mode==="good"?Math.floor(c/2)*inc:mode==="plateau"?Math.min(2,Math.floor(c/3))*inc:Math.max(0,4-Math.floor(c/2))*inc),reps=mode==="good"?8+(n%4):mode==="plateau"?9:8;
      for(let s=0;s<3;s++)sets.push({id:uid(),ex,w,r:Math.max(5,reps-s),rpe:7+s+(mode==="good"?0:1)>10?10:7+s+(mode==="good"?0:1),t:dateOf(day).getTime()+s})});
    S.days[day]={sets,swaps:{}}}
  S.body=[];for(let d=-56;d<=0;d+=3)S.body.push({d:addDays(todayStr(),d),w:Math.round((77+(d+56)*0.04+(Math.sin(d)*0.3))*10)/10,bf:d>-5?15:d<-50?16:null});
  S.goals=[{id:"g1",ex:id("Жим штанги лёжа"),target:125,by:addDays(todayStr(),120)},{id:"g2",ex:id("Приседания со штангой"),target:190,by:null}];
  inval();render();
}

async function getSample(){return null}
const PHOTOS_KEY="gymphotos";let PHOTOS={};try{PHOTOS=JSON.parse(localStorage.getItem(PHOTOS_KEY)||"{}")}catch(e){PHOTOS={}}
function savePhotos(){try{localStorage.setItem(PHOTOS_KEY,JSON.stringify(PHOTOS));return true}catch(e){setSync("Мало места для фото — убери пару старых");return false}}
function pic(ex){const p=ex&&PHOTOS[ex.id];return p?`<img class="ph" src="${p}" alt="" loading="lazy">`:eqSVG(ex?ex.eq:"press")}
async function shrinkTo(file,max){try{const bmp=await createImageBitmap(file);const k=Math.min(1,max/Math.max(bmp.width,bmp.height));const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",0.8))}catch(e){return file}}
async function uploadPhoto(id){const f=await pickPhoto();if(!f)return;const b=await shrinkTo(f,640);const url=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)});PHOTOS[id]=url;if(savePhotos())setSync("Фото сохранено");render();openSheet(id,"info")}
function handoff(text){try{navigator.clipboard&&navigator.clipboard.writeText(text).catch(()=>{})}catch(e){}const url="https://claude.ai/new?q="+encodeURIComponent(text.length>5500?text.slice(0,5500)+"…":text);const w=window.open(url,"_blank");if(!w)location.href=url;setSync("Открываю Claude — текст вставлен и скопирован")}
async function askCoach(){const q=$("ask").value.trim();if(!q){$("ask").focus();return}handoff("Ты мой персональный тренер. Отвечай по-русски, коротко и конкретно: что делать, подходы, вес, повторы, на сколько недель. Опирайся на мои данные из журнала тренировок.\n\nВопрос: "+q+"\n\nМои данные:\n"+summaryForAI())}
function recognizeMachine(){handoff("Сейчас пришлю фото тренажёра из зала. Скажи коротко по-русски: 1) что это за тренажёр, 2) как его настроить и как сесть или встать, 3) какие упражнения на нём делать — обычными русскими названиями, на какие мышцы. Фото — следующим сообщением.")}
function backupSave(){if(S.demo){setSync("Сначала убери пример");return}lsWrite();const data=JSON.stringify({app:"gymlog",v:4,date:todayStr(),store:JSON.parse(localStorage.getItem(LS)||"{}"),photos:PHOTOS});const name="zal-backup-"+todayStr()+".json";const file=new File([data],name,{type:"application/json"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).catch(()=>{});return}
  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function backupLoad(){const inp=document.createElement("input");inp.type="file";inp.accept="application/json,.json";inp.onchange=async()=>{const f=inp.files&&inp.files[0];if(!f)return;try{const o=JSON.parse(await f.text());if(o.app!=="gymlog"||!o.store)throw 0;if(!confirm("Заменить текущие данные копией от "+(o.date||"?")+"?"))return;localStorage.setItem(LS,JSON.stringify(o.store));PHOTOS=o.photos||{};savePhotos();S.demo=false;S.real=null;applyLoaded(o.store);render();setSync("Данные восстановлены")}catch(e){setSync("Это не файл копии журнала")}};inp.click()}
